[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saleor-analytics"
version = "0.1.0"
description = "Replayable Saleor analytics with PySpark, Parquet and Dash"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "dash>=3,<4",
    "plotly>=6,<7",
    "pandas>=2.2,<3",
    "filelock>=3.16,<4",
    "pyspark==4.2.0",
    "pyarrow>=18,<25",
]

[project.scripts]
saleor-analytics = "saleor_analytics.cli:cli"

# PySpark 4.2 is published as a 450 MB source archive. These PyPI metadata
# fields let uv resolve the lock without downloading that archive first.
[[tool.uv.dependency-metadata]]
name = "pyspark"
version = "4.2.0"
requires-python = ">=3.10"
requires-dist = ["py4j>=0.10.9.7,<0.10.9.10"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "build", "graphql-core>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/saleor_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: executes Spark and publication"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
