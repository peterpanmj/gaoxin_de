[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saleor-analytics"
version = "0.1.0"
description = "Replayable Saleor analytics with dbt, DuckDB and Dash"
requires-python = ">=3.12,<3.14"
dependencies = ["click>=8.1,<9", "httpx>=0.27,<1", "duckdb>=1.4,<1.6", "dbt-core>=1.10,<1.12", "dbt-duckdb>=1.9,<1.11", "dash>=3,<4", "plotly>=6,<7", "pandas>=2.2,<3", "filelock>=3.16,<4"]

[project.scripts]
saleor-analytics = "saleor_analytics.cli:cli"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "build", "graphql-core>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/saleor_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: executes dbt and publication"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
