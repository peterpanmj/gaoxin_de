image: python:3.12-slim

stages:
  - lint
  - test
  - data_quality
  - package
  - promote

default:
  before_script:
    - pip install uv
    - uv sync --frozen

python_lint:
  stage: lint
  script: uv run ruff check src tests

python_tests:
  stage: test
  script: uv run pytest -q

dbt_parse:
  stage: data_quality
  variables:
    ANALYTICS_DATABASE_PATH: /tmp/analytics.duckdb
  script: uv run dbt parse --project-dir analytics --profiles-dir analytics --target candidate

package:
  stage: package
  script: uv build
  artifacts:
    paths: [dist/]
  rules:
    - if: $CI_COMMIT_BRANCH

promote_production:
  stage: promote
  script: echo "Deploy the approved package and DAG using protected environment credentials."
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
