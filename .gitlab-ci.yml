image: python:3.12-slim

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - data_quality
  - package
  - promote

default:
  before_script:
    - pip install uv
    - uv sync --frozen

python_lint:
  stage: lint
  script:
    - uv run ruff format --check src tests dags
    - uv run ruff check src tests dags

python_tests:
  stage: test
  script: uv run pytest -q -m "not integration"

dbt_quality:
  stage: data_quality
  variables:
    ANALYTICS_DATABASE_PATH: /tmp/analytics.duckdb
  script: uv run pytest -q -m integration

package:
  stage: package
  script: uv build
  artifacts:
    paths: [dist/]

promote_production:
  stage: promote
  script: echo "Deploy the approved package and DAG using protected environment credentials."
  environment:
    name: production
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
